<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Cafe Accounting</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>حسابداری گیم نت</h1>
            <div class="theme-switcher">
                <label class="switch">
                    <input type="checkbox" id="theme-switch">
                    <span class="slider round"></span>
                </label>
                <span>حالت تاریک</span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-link active" data-tab="billing">صورتحساب</button>
            <button class="tab-link" data-tab="products">محصولات</button>
            <button class="tab-link" data-tab="invoices">فاکتورها</button>
            <button class="tab-link" data-tab="reports">گزارشات</button>
            <button class="tab-link" data-tab="settings">تنظیمات</button>
        </div>

        <div id="billing" class="tab-content active">
            <div class="card">
                <h2>محاسبه هزینه بازی</h2>
                <div class="form-group">
                    <label for="device-select">انتخاب دستگاه:</label>
                    <select id="device-select"></select>
                </div>
                <div class="form-group">
                    <label for="start-time">زمان شروع:</label>
                    <input type="datetime-local" id="start-time">
                </div>
                <div class="form-group">
                    <label for="end-time">زمان پایان:</label>
                    <input type="datetime-local" id="end-time">
                </div>
                <button id="calculate-btn">محاسبه</button>
                <div id="result"></div>
            </div>
            <div class="card">
                <h2>فاکتور فعلی</h2>
                <ul id="invoice-items"></ul>
                <div id="total-cost"></div>
                <button id="print-invoice-btn">چاپ فاکتور</button>
                <button id="save-invoice-btn">ذخیره فاکتور</button>
                <button id="new-invoice-btn">فاکتور جدید</button>
            </div>
        </div>

        <div id="products" class="tab-content">
            <div class="card">
                <h2>محصولات</h2>
                <div id="product-list"></div>
                <hr>
                <h3>افزودن محصول جدید به کاتالوگ</h3>
                <div class="form-group">
                    <input type="text" id="new-product-name" placeholder="نام محصول جدید">
                    <input type="number" id="new-product-price" placeholder="قیمت (تومان)">
                    <button id="add-new-product-btn">افزودن محصول</button>
                </div>
            </div>
        </div>

        <div id="invoices" class="tab-content">
            <div class="card">
                <h2>فاکتورهای ذخیره شده</h2>
                <div id="invoice-list"></div>
            </div>
        </div>

        <div id="reports" class="tab-content">
            <div class="card">
                <h2>گزارشات</h2>
                <div class="form-group">
                    <label for="report-start-date">از تاریخ:</label>
                    <input type="date" id="report-start-date">
                </div>
                <div class="form-group">
                    <label for="report-end-date">تا تاریخ:</label>
                    <input type="date" id="report-end-date">
                </div>
                <button id="generate-report-btn">تولید گزارش</button>
                <div id="report-content"></div>
            </div>
        </div>

        <div id="settings" class="tab-content">
            <div class="card">
                <h2>تنظیمات</h2>
                <div id="device-settings">
                    <h3>دستگاه‌ها</h3>
                    <div id="device-list"></div>
                    <div class="form-group">
                        <input type="text" id="new-device-name" placeholder="نام دستگاه جدید">
                        <input type="number" id="new-device-rate" placeholder="هزینه ساعتی (تومان)">
                        <button id="add-device-btn">افزودن دستگاه</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>
    <div id="invoice-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>مشاهده فاکتور</h2>
            <div id="modal-invoice-content"></div>
        </div>
    </div>
</body>
</html>
